<body>
  <h1>Book Outline</h1>

  <p>Edit your chapter outline before writing the book.</p>

  <label for="chapter-1">Chapter 1</label><br>
  <input
    id="chapter-1"
    type="text"
    value="Introduction"
  ><br><br>

  <label for="chapter-2">Chapter 2</label><br>
  <input
    id="chapter-2"
    type="text"
    value="The Main Story"
  ><br><br>

  <label for="chapter-3">Chapter 3</label><br>
  <input
    id="chapter-3"
    type="text"
    value="Important Turning Point"
  ><br><br>

  <label for="chapter-4">Chapter 4</label><br>
  <input
    id="chapter-4"
    type="text"
    value="Conclusion"
  ><br><br>

  <button type="button">Add Chapter</button>
  <button type="button">Continue to Writing</button>

  <p><a href="create.html">Back to Book Details</a></p>
  <p><a href="index.html">Back to Home</a></p>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Cover - MARABU BOOK STUDIO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f1e8;
      color: #222222;
      font-family: Arial, sans-serif;
    }

    .cover-card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      color: #6b3f24;
    }

    input {
      width: 100%;
      margin: 18px 0;
      padding: 12px;
    }

    #cover-preview {
      display: none;
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 16px;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #6b3f24;
      color: #ffffff;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      background: #4f2d1a;
    }
  </style>
</head>
<body>
  <main class="cover-card">
    <h1>Book Cover</h1>

    <p>Upload your own cover image.</p>

    <input id="cover-upload" type="file" accept="image/*">

    <img id="cover-preview" alt="Uploaded book cover preview">

    <button id="save-cover" class="button" type="button">
      Save Cover
    </button>

    <a class="button" href="preview.html">Open Book Preview</a>
    <a class="button" href="index.html">Back to Home</a>
  </main>

  <script>
    const upload = document.getElementById("cover-upload");
    const preview = document.getElementById("cover-preview");
    const saveButton = document.getElementById("save-cover");

    let selectedImage = "";

    upload.addEventListener("change", function () {
      const file = upload.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.addEventListener("load", function () {
        selectedImage = reader.result;
        preview.src = selectedImage;
        preview.style.display = "block";
      });

      reader.readAsDataURL(file);
    });

    const savedCover = localStorage.getItem("marabuCover");

    if (savedCover) {
      selectedImage = savedCover;
      preview.src = savedCover;
      preview.style.display = "block";
    }

    saveButton.addEventListener("click", function () {
      if (!selectedImage) {
        alert("Please choose an image first.");
        return;
      }

      localStorage.setItem("marabuCover", selectedImage);
      alert("Cover saved");
    });
  </script>
</body>
</html>

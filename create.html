<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Book - MARABU BOOK STUDIO</title>
</head>
<body>
  <h1>Create Your Book</h1>

  <form id="book-form">
    <label for="title">Book title</label><br>
    <input id="title" name="title" type="text" required><br><br>

    <label for="author">Author</label><br>
    <input id="author" name="author" type="text" required><br><br>

    <label for="book-type">Book type</label><br>
    <select id="book-type" name="book-type">
      <option>Children's Book</option>
      <option>Fiction</option>
      <option>Informative Book</option>
      <option>Educational Book</option>
      <option>Recipe Book</option>
      <option>Manga</option>
      <option>Technology Book</option>
      <option>Guide / How-To Book</option>
      <option>Story Book</option>
      <option>Custom Book</option>
    </select><br><br>

    <label for="language">Language</label><br>
    <select id="language" name="language">
      <option>English</option>
      <option>Tamil</option>
      <option>Hindi</option>
      <option>Telugu</option>
      <option>Malayalam</option>
      <option>Kannada</option>
      <option>Bengali</option>
      <option>Marathi</option>
      <option>Gujarati</option>
      <option>Punjabi</option>
      <option>Urdu</option>
    </select><br><br>

    <label for="idea">Main idea</label><br>
    <textarea id="idea" name="idea" rows="8" cols="40" required></textarea><br><br>

    <button type="submit">Save and Continue</button>
  </form>

  <p><a href="index.html">Back to home</a></p>

  <script>
    const form = document.getElementById("book-form");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        bookType: document.getElementById("book-type").value,
        language: document.getElementById("language").value,
        idea: document.getElementById("idea").value
      };

      localStorage.setItem("marabuBook", JSON.stringify(book));

      window.location.href = "outline.html";
    });
  </script>
</body>
</html>
